# Lab roster, grouped by degree level within Current Members and Alumni.
# To add someone: append an entry under `current` (or `alumni`) and drop a photo
# at assets/img/people/<slug>.<ext>. Nothing else needs editing.
#
# Fields: name, level (Ph.D. | M.S. | B.S. | High School -- drives the grouping
#         and ordering on /people/), degree, grad (verbatim parenthetical),
#         area, now (where an alum went next), distinctions[],
#         photo (path under assets/img/), links{}

pi:
  name: Darshan Sarojini
  photo: people/darshan-sarojini.jpg
  email: sdarshan@vt.edu
  bio:
    - Darshan Sarojini is an Assistant Professor at Virginia Tech, where he heads the Intelligent Design Optimization Lab (IDOpt Lab) in the Aerospace and Ocean Engineering department.
    - He serves on the AIAA Modeling and Simulation Technical Committee, Aircraft Design Technical Committee, Transformational Flight Intergration and Outreach Committee and Multimodal Transportation Working Group, and on a number of committees at the ACM/IEEE SuperComputing Conference.
    - He has a bachelor's degree in mechanical engineering, a master's degree in computational science and engineering, and a Ph.D. in aerospace engineering. His graduate school research was conducted in the <a href="https://www.asdl.gatech.edu/">Aerospace Systems Design Lab</a> at Georgia Tech and postdoctoral research at the <a href="https://lsdo.eng.ucsd.edu/">Large Scale Design Optimization</a> lab at UC San Diego.
  links:
    Website: https://www.aoe.vt.edu/people/faculty/darshan-sarojini.html
    Google Scholar: https://scholar.google.com/citations?user=BmotoisAAAAJ
    LinkedIn: https://www.linkedin.com/in/darshan-sarojini-31b89999/
    ORCID: https://orcid.org/0000-0003-4910-3505
    GitHub: https://github.com/darshansarojini

